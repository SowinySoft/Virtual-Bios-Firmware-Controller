[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vbfc-cli"
version = "1.0.0"
description = "Host CLI for Virtual BIOS Firmware Controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "click>=8.1",
    "cryptography>=42.0",
]

[project.scripts]
vbfc-cli = "vbfc_cli.main:cli"
vbfc-breadboard = "vbfc_cli.breadboard:main"
vbfc-breadboard-run = "vbfc_cli.breadboard_runner:main"
vbfc-breadboard-log = "vbfc_cli.breadboard_logger:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vbfc_cli*"]
